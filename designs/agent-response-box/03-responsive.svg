y="Adwaita Sans" font-size="12" font-weight="400" fill="#ABB1BF" text-anchor="start">9:16 PM</text><g transform="translate(344 171) scale(0.5833333333333334)" fill="none" stroke="#ABB1BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><rect x="20" y="232" width="30" height="30" rx="12" fill="#252A34"/><g transform="translate(26.0 238.0) scale(0.75)" fill="none" stroke="#ABB1BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.6 5 4 7.4 9 9-5 1.6-7.4 4-9 9-1.6-5-4-7.4-9-9 5-1.6 7.4-4 9-9Z"/></g><text x="62" y="251" font-family="Adwaita Sans" font-size="14" font-weight="650" fill="#F0F1F5" text-anchor="start">suresh</text><text x="117" y="251" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#ABB1BF" text-anchor="start">Agent  ·  9:16 PM</text><g id="Compact-agent-response" transform="translate(0 0)"><rect x="20" y="270" width="350" height="248" rx="16" fill="#252A34" stroke="#303540" stroke-width="1"/><defs><linearGradient id="fade-dark" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#252A34" stop-opacity="0"/><stop offset="1" stop-color="#252A34"/></linearGradient></defs><g id="Bounded-preview-200px" transform="translate(0 0)"><text x="40" y="300" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#F0F1F5" text-anchor="start">Hi! Still here and happy to help</text><text x="40" y="326" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#F0F1F5" text-anchor="start">whenever you’re ready.</text><text x="40" y="368" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#F0F1F5" text-anchor="start">Two quick guesses at what you</text><text x="40" y="394" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#F0F1F5" text-anchor="start">mean by “whatsaap”:</text><text x="40" y="436" font-family="Adwaita Sans" font-size="16" font-weight="650" fill="#F0F1F5" text-anchor="start">If you mean “what’s up?”</text><text x="40" y="462" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#F0F1F5" text-anchor="start">Not much! I checked my current</text></g><rect x="21" y="434" width="348" height="36" rx="0" fill="url(#fade-dark)"/><path d="M21 470 H369" fill="none" stroke="#303540"/><g transform="translate(38 485) scale(0.75)" fill="none" stroke="#F0F1F5" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="66" y="500" font-family="Adwaita Sans" font-size="14" font-weight="600" fill="#F0F1F5" text-anchor="start">Expand response</text><g transform="translate(328 484) scale(0.8333333333333334)" fill="none" stroke="#ABB1BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></g></g><g id="Floating-message-composer" transform="translate(0 0)"><rect x="20" y="742" width="350" height="64" rx="18" fill="#1C1F26" stroke="#697487" stroke-width="1"/><g transform="translate(38 765) scale(0.8333333333333334)" fill="none" stroke="#ABB1BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 13 7-7a3 3 0 0 1 4 4l-9 9a5 5 0 0 1-7-7l10-10"/></g><text x="72" y="782" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#ABB1BF" text-anchor="start">Message…</text><g transform="translate(278 764) scale(0.8333333333333334)" fill="none" stroke="#ABB1BF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></g><rect x="316" y="754" width="42" height="42" rx="12" fill="#F0F1F5"/><g transform="translate(327 764) scale(0.9166666666666666)" fill="none" stroke="#20222A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4m-6 6 6-6 6 6"/></g></g></g></g><text x="892" y="180" font-family="Adwaita Sans" font-size="21" font-weight="650" fill="#22252A" text-anchor="start">Recommended behavior</text><text x="892" y="230" font-family="Adwaita Sans" font-size="12" font-weight="600" fill="#697079" text-anchor="start">01</text><text x="892" y="259" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">A soft message background</text><text x="892" y="287" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">16 px corners, a quiet 1 px border,</text><text x="892" y="310" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">and 20 px padding.</text><text x="892" y="356" font-family="Adwaita Sans" font-size="12" font-weight="600" fill="#697079" text-anchor="start">02</text><text x="892" y="385" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">A compact default</text><text x="892" y="413" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">200 px preview + 48 px footer.</text><text x="892" y="436" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">Short replies use only their height.</text><text x="892" y="482" font-family="Adwaita Sans" font-size="12" font-weight="600" fill="#697079" text-anchor="start">03</text><text x="892" y="511" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">Expand in the conversation</text><text x="892" y="539" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">Reveal the complete saved reply.</text><text x="892" y="562" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">Collapse returns to the same place.</text><text x="892" y="608" font-family="Adwaita Sans" font-size="12" font-weight="600" fill="#697079" text-anchor="start">04</text><text x="892" y="637" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">Keep Chat calm</text><text x="892" y="665" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">No Check progress button.</text><text x="892" y="688" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">Task activity stays in Agents → Work.</text><text x="892" y="734" font-family="Adwaita Sans" font-size="12" font-weight="600" fill="#697079" text-anchor="start">05</text><text x="892" y="763" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">Keep reading stable</text><text x="892" y="791" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">No scrollbar inside the preview.</text><text x="892" y="814" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">Expansion is always a user action.</text><path d="M892 878 H1198" fill="none" stroke="#D6DAE0"/><text x="892" y="910" font-family="Adwaita Sans" font-size="13" font-weight="550" fill="#697079" text-anchor="start">Illustrative design only</text><text x="892" y="936" font-family="Adwaita Sans" font-size="13" font-weight="400" fill="#697079" text-anchor="start">Application code is unchanged.</text></svg>