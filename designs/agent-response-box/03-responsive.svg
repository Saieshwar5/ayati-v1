<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1020" viewBox="0 0 1240 1020"><rect x="0" y="0" width="1240" height="1020" rx="0" fill="#ECEEF0"/><text x="40" y="52" font-family="Adwaita Sans" font-size="30" font-weight="650" fill="#22252A" text-anchor="start">A calmer way to read agent replies</text><text x="40" y="82" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">One message surface. Two reading states.</text><text x="40" y="126" font-family="Adwaita Sans" font-size="12" font-weight="650" fill="#697079" text-anchor="start">PHONE · LIGHT</text><text x="458" y="126" font-family="Adwaita Sans" font-size="12" font-weight="650" fill="#697079" text-anchor="start">PHONE · DARK</text><g id="Phone-light-preview" transform="translate(40 146)"><g id="Phone-light" transform="translate(0 0)"><rect x="0" y="0" width="390" height="844" rx="0" fill="#F3F4F5"/><rect x="6" y="6" width="378" height="832" rx="16" fill="#FFFFFF"/><g transform="translate(18 27) scale(0.9166666666666666)" fill="none" stroke="#22252A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></g><rect x="52" y="18" width="40" height="40" rx="12" fill="#F7F8F9"/><g transform="translate(63.0 29.0) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.6 5 4 7.4 9 9-5 1.6-7.4 4-9 9-1.6-5-4-7.4-9-9 5-1.6 7.4-4 9-9Z"/></g><text x="104" y="35" font-family="Adwaita Sans" font-size="16" font-weight="650" fill="#22252A" text-anchor="start">suresh</text><text x="104" y="54" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#697079" text-anchor="start">Agent  ·  Connected</text><g transform="translate(342 27) scale(0.9166666666666666)" fill="none" stroke="#22252A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></g><path d="M6 70 H384" fill="none" stroke="#E5E7EA"/><text x="195" y="106" font-family="Adwaita Sans" font-size="12" font-weight="500" fill="#697079" text-anchor="middle">Today</text><rect x="244" y="130" width="126" height="72" rx="14" fill="#F7F8F9"/><text x="260" y="158" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">whatsaap</text><text x="260" y="183" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#697079" text-anchor="start">9:16 PM</text><g transform="translate(344 171) scale(0.5833333333333334)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></g><rect x="20" y="232" width="30" height="30" rx="12" fill="#F7F8F9"/><g transform="translate(26.0 238.0) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.6 5 4 7.4 9 9-5 1.6-7.4 4-9 9-1.6-5-4-7.4-9-9 5-1.6 7.4-4 9-9Z"/></g><text x="62" y="251" font-family="Adwaita Sans" font-size="14" font-weight="650" fill="#22252A" text-anchor="start">suresh</text><text x="117" y="251" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#697079" text-anchor="start">Agent  ·  9:16 PM</text><g id="Compact-agent-response" transform="translate(0 0)"><rect x="20" y="270" width="350" height="248" rx="16" fill="#F7F8F9" stroke="#E5E7EA" stroke-width="1"/><defs><linearGradient id="fade-light" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#F7F8F9" stop-opacity="0"/><stop offset="1" stop-color="#F7F8F9"/></linearGradient></defs><g id="Bounded-preview-200px" transform="translate(0 0)"><text x="40" y="300" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Hi! Still here and happy to help</text><text x="40" y="326" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">whenever you’re ready.</text><text x="40" y="368" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Two quick guesses at what you</text><text x="40" y="394" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">mean by “whatsaap”:</text><text x="40" y="436" font-family="Adwaita Sans" font-size="16" font-weight="650" fill="#22252A" text-anchor="start">If you mean “what’s up?”</text><text x="40" y="462" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Not much! I checked my current</text></g><rect x="21" y="434" width="348" height="36" rx="0" fill="url(#fade-light)"/><path d="M21 470 H369" fill="none" stroke="#E5E7EA"/><g transform="translate(38 485) scale(0.75)" fill="none" stroke="#22252A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g><text x="66" y="500" font-family="Adwaita Sans" font-size="14" font-weight="600" fill="#22252A" text-anchor="start">Expand response</text><g transform="translate(328 484) scale(0.8333333333333334)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></g></g><g id="Floating-message-composer" transform="translate(0 0)"><rect x="20" y="742" width="350" height="64" rx="18" fill="#FFFFFF" stroke="#AEB8C5" stroke-width="1"/><g transform="translate(38 765) scale(0.8333333333333334)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 13 7-7a3 3 0 0 1 4 4l-9 9a5 5 0 0 1-7-7l10-10"/></g><text x="72" y="782" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">Message…</text><g transform="translate(278 764) scale(0.8333333333333334)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" 