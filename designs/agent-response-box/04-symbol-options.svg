<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="850" viewBox="0 0 1800 850"><rect x="0" y="0" width="1800" height="850" rx="0" fill="#FFFFFF"/><text x="48" y="62" font-family="Adwaita Sans" font-size="36" font-weight="650" fill="#22252A" text-anchor="start">Let the response invite you to open it.</text><text x="48" y="99" font-family="Adwaita Sans" font-size="17" font-weight="400" fill="#697079" text-anchor="start">Three symbol-based directions · bounded text · no labelled expansion button · no progress controls</text><text x="48" y="168" font-family="Adwaita Sans" font-size="15" font-weight="650" fill="#697079" text-anchor="start">A</text><text x="78" y="168" font-family="Adwaita Sans" font-size="24" font-weight="650" fill="#22252A" text-anchor="start">Fade + double chevron</text><text x="48" y="202" font-family="Adwaita Sans" font-size="13" font-weight="600" fill="#22252A" text-anchor="start">Recommended</text><g id="Compact-symbol-response-A" transform="translate(0 0)"><rect x="52" y="290" width="520" height="224" rx="16" fill="#F7F8F9" stroke="#E5E7EA" stroke-width="1"/><g id="Saved-response-text" transform="translate(0 0)"><text x="72" y="322" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Hi! Still here and happy to help whenever you’re ready.</text><text x="72" y="362" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Two quick guesses at what you mean by “whatsaap”:</text><text x="72" y="402" font-family="Adwaita Sans" font-size="16" font-weight="650" fill="#22252A" text-anchor="start">If you mean “what’s up?”</text><text x="72" y="442" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Not much! I checked my current task capabilities just now. No</text><text x="72" y="468" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">browsing operations are assigned to this task yet, so I can’t</text></g><defs><linearGradient id="fade-Alight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F9" stop-opacity="0"/><stop offset="0.72" stop-color="#F7F8F9"/><stop offset="1" stop-color="#F7F8F9"/></linearGradient></defs><rect x="53" y="434" width="518" height="79" rx="15" fill="url(#fade-Alight)"/><g id="Integrated-disclosure-symbol" transform="translate(0 0)"><g transform="translate(302.0 484) scale(0.8333333333333334)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m7 5 5 5 5-5M7 12l5 5 5-5"/></g></g></g><rect x="52" y="242" width="32" height="32" rx="12" fill="#F7F8F9"/><g transform="translate(59.0 249.0) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.6 5 4 7.4 9 9-5 1.6-7.4 4-9 9-1.6-5-4-7.4-9-9 5-1.6 7.4-4 9-9Z"/></g><text x="96" y="260" font-family="Adwaita Sans" font-size="14" font-weight="650" fill="#22252A" text-anchor="start">suresh</text><text x="152" y="260" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#697079" text-anchor="start">Agent  ·  9:16 PM</text><g transform="translate(546 243) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></g><text x="48" y="562" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">The text fades into a quiet, integrated symbol.</text><text x="48" y="589" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">Two downward chevrons suggest more below.</text><text x="48" y="616" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">Open it in place. The symbol reverses to close.</text><text x="48" y="674" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">The clearest fit for inline expansion.</text><text x="632" y="168" font-family="Adwaita Sans" font-size="15" font-weight="650" fill="#697079" text-anchor="start">B</text><text x="662" y="168" font-family="Adwaita Sans" font-size="24" font-weight="650" fill="#22252A" text-anchor="start">Corner arrows</text><text x="632" y="202" font-family="Adwaita Sans" font-size="13" font-weight="600" fill="#697079" text-anchor="start">A familiar alternative</text><g id="Compact-symbol-response-B" transform="translate(0 0)"><rect x="636" y="290" width="520" height="224" rx="16" fill="#F7F8F9" stroke="#E5E7EA" stroke-width="1"/><g id="Saved-response-text" transform="translate(0 0)"><text x="656" y="322" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Hi! Still here and happy to help whenever you’re ready.</text><text x="656" y="362" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Two quick guesses at what you mean by “whatsaap”:</text><text x="656" y="402" font-family="Adwaita Sans" font-size="16" font-weight="650" fill="#22252A" text-anchor="start">If you mean “what’s up?”</text><text x="656" y="442" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Not much! I checked my current task capabilities just now. No</text><text x="656" y="468" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">browsing operations are assigned to this task yet, so I can’t</text></g><defs><linearGradient id="fade-Blight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F9" stop-opacity="0"/><stop offset="0.72" stop-color="#F7F8F9"/><stop offset="1" stop-color="#F7F8F9"/></linearGradient></defs><rect x="637" y="434" width="518" height="79" rx="15" fill="url(#fade-Blight)"/><g id="Corner-expand-symbol" transform="translate(0 0)"><g transform="translate(1122 480) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-6 6M10 20H4v-6m0 6 6-6"/></g></g></g><rect x="636" y="242" width="32" height="32" rx="12" fill="#F7F8F9"/><g transform="translate(643.0 249.0) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.6 5 4 7.4 9 9-5 1.6-7.4 4-9 9-1.6-5-4-7.4-9-9 5-1.6 7.4-4 9-9Z"/></g><text x="680" y="260" font-family="Adwaita Sans" font-size="14" font-weight="650" fill="#22252A" text-anchor="start">suresh</text><text x="736" y="260" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#697079" text-anchor="start">Agent  ·  9:16 PM</text><g transform="translate(1130 243) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></g><text x="632" y="562" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">A small expansion glyph sits in the lower corner.</text><text x="632" y="589" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">The rest of the surface stays uninterrupted.</text><text x="632" y="616" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">Recognizable, though it can suggest full screen.</text><text x="632" y="674" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">Best when opening a larger reading view.</text><text x="1216" y="168" font-family="Adwaita Sans" font-size="15" font-weight="650" fill="#697079" text-anchor="start">C</text><text x="1246" y="168" font-family="Adwaita Sans" font-size="24" font-weight="650" fill="#22252A" text-anchor="start">Folded corner</text><text x="1216" y="202" font-family="Adwaita Sans" font-size="13" font-weight="600" fill="#697079" text-anchor="start">A more expressive alternative</text><g id="Compact-symbol-response-C" transform="translate(0 0)"><rect x="1220" y="290" width="520" height="224" rx="16" fill="#F7F8F9" stroke="#E5E7EA" stroke-width="1"/><g id="Saved-response-text" transform="translate(0 0)"><text x="1240" y="322" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Hi! Still here and happy to help whenever you’re ready.</text><text x="1240" y="362" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Two quick guesses at what you mean by “whatsaap”:</text><text x="1240" y="402" font-family="Adwaita Sans" font-size="16" font-weight="650" fill="#22252A" text-anchor="start">If you mean “what’s up?”</text><text x="1240" y="442" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">Not much! I checked my current task capabilities just now. No</text><text x="1240" y="468" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#22252A" text-anchor="start">browsing operations are assigned to this task yet, so I can’t</text></g><defs><linearGradient id="fade-Clight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F8F9" stop-opacity="0"/><stop offset="0.72" stop-color="#F7F8F9"/><stop offset="1" stop-color="#F7F8F9"/></linearGradient></defs><rect x="1221" y="434" width="518" height="79" rx="15" fill="url(#fade-Clight)"/><g id="Folded-disclosure-corner" transform="translate(0 0)"><path d="M1702 514 L1740 476 L1740 514 Z" fill="#FFFFFF"/><path d="M1702 514 V486 Q1702 476 1712 476 H1740 Z" fill="#EEF0F2" stroke="#E5E7EA"/><g transform="translate(1705 478) scale(0.7083333333333334)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></g></g></g><rect x="1220" y="242" width="32" height="32" rx="12" fill="#F7F8F9"/><g transform="translate(1227.0 249.0) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1.6 5 4 7.4 9 9-5 1.6-7.4 4-9 9-1.6-5-4-7.4-9-9 5-1.6 7.4-4 9-9Z"/></g><text x="1264" y="260" font-family="Adwaita Sans" font-size="14" font-weight="650" fill="#22252A" text-anchor="start">suresh</text><text x="1320" y="260" font-family="Adwaita Sans" font-size="12" font-weight="400" fill="#697079" text-anchor="start">Agent  ·  9:16 PM</text><g transform="translate(1714 243) scale(0.75)" fill="none" stroke="#697079" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></g><text x="1216" y="562" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">A turned corner suggests a reply with more inside.</text><text x="1216" y="589" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">It gives the response a tactile, paper-like edge.</text><text x="1216" y="616" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">The fold can also be mistaken for a file.</text><text x="1216" y="674" font-family="Adwaita Sans" font-size="16" font-weight="600" fill="#22252A" text-anchor="start">Distinctive, with a less obvious meaning.</text><path d="M48 736 H1752" fill="none" stroke="#E5E7EA"/><text x="48" y="780" font-family="Adwaita Sans" font-size="16" font-weight="400" fill="#697079" text-anchor="start">For A: make the faded lower edge the tap target. Keep the text selectable. A brief hover/focus hint explains the symbol.</text><text x="48" y="812" font-family="Adwaita Sans" font-size="14" font-weight="400" fill="#697079" text-anchor="start">Short replies end naturally and show no disclosure symbol. These are visual concepts; the application is unchanged.</text></svg>