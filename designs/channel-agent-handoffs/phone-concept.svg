        </g>
        <g transform="translate(0, 38)">
          <text x="0" y="14" font-family="Inter" font-size="14" fill="#282D35">finishes.</text>
        </g>
      </g>
      <g transform="translate(20, 542)">
        <g>
          <text x="0" y="13" font-family="Inter" font-size="13" fill="#282D35">Each agent keeps its own permissions.</text>
        </g>
        <g transform="translate(0, 18)">
          <text x="0" y="13" font-family="Inter" font-size="13" fill="#282D35">Asking another agent cannot widen</text>
        </g>
        <g transform="translate(0, 36)">
          <text x="0" y="13" font-family="Inter" font-size="13" fill="#282D35">access.</text>
        </g>
      </g>
      <g transform="translate(20, 614)">
        <rect width="338" height="1" fill="#E4E7EB"/>
      </g>
      <g transform="translate(20, 635)">
