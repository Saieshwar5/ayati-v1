<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Connector screens mockups</title>
<style>
:root{--surface:#fff;--canvas:#f3f4f5;--text:#22252a;--muted:#697079;--border:#e5e7ea;--border-panel:#d1d6dd;--border-control:#aeb8c5;--soft:#f5f6f7;--selection:#eef0f2;--accent:#22252a;--danger:#a42f35;--danger-bg:#fdeeee;--warning:#945b10;--warning-bg:#fff3e2;--success:#26745c;--success-bg:#e3f3ea;--link:#3d55c9;--info-bg:#eef1fd;--pin:#e0a800}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--text);background:#fff;font-size:14px;-webkit-font-smoothing:antialiased}
.screen{width:1820px;height:900px;display:flex;position:relative;overflow:hidden;background:#fff;margin-bottom:40px}
.app{width:1440px;height:900px;background:var(--canvas);position:relative;flex:0 0 auto}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto;vertical-align:middle}
.rail{position:absolute;left:0;top:0;bottom:0;width:88px;display:flex;flex-direction:column;align-items:center;padding-top:34px;gap:10px}
.rail .logo{width:36px;height:26px;margin-bottom:26px}
.rail a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#3a3f46}
.rail a.on{background:var(--accent);color:#fff}
.rail .bottom{position:absolute;bottom:30px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rail .me{width:34px;height:34px;border-radius:50%;background:#efe9d9;display:grid;place-items:center;font-size:12px;font-weight:600;color:#5b4a1f}
.frame{position:absolute;left:88px;top:12px;width:1340px;height:876px;background:#fff;border-radius:18px;box-shadow:0 8px 24px rgb(23 33 43/10%);display:flex;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--border-control);background:#fff;font:inherit;font-size:13.5px;font-weight:550;color:var(--text);white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{min-height:30px;padding:0 10px;font-size:13px}
.btn.quiet{border-color:transparent;background:var(--soft)}
.btn.done{border-color:transparent;background:var(--success-bg);color:var(--success)}
.btn .i{width:16px;height:16px}
.muted{color:var(--muted)}
.pin{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--pin);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 3px rgb(0 0 0/.25);z-index:30}
.notes{flex:1;padding:4px 26px 0 30px;background:#fff}
.notes h2{font-size:19px;font-weight:600;margin:0 0 18px}
.notes ol{list-style:none;margin:0;padding:0;display:grid;gap:13px}
.notes li{display:grid;grid-template-columns:24px 1fr;gap:10px;font-size:13.5px;line-height:1.48;color:#33383e}
.notes li i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--pin);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.notes .sub{margin-top:22px;padding-top:16px;border-top:1px solid var(--border);font-size:13px;line-height:1.5;color:var(--muted)}
.notes .sub b{color:var(--text)}
/* Apps page */
.apps-main{flex:1;min-width:0;padding:28px 32px;position:relative}
.apps-header{display:flex;align-items:center;justify-content:space-between;gap:14px}
.apps-header h1{margin:0;font-size:28px;letter-spacing:-.02em;font-weight:650}
.tools{display:flex;gap:10px;align-items:center}
.search{display:flex;align-items:center;gap:8px;width:240px;height:40px;border-radius:12px;background:var(--soft);padding:0 14px;color:var(--muted)}
.filters{margin-top:18px;display:flex;gap:8px;align-items:center}
.filters span{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--border-panel);display:inline-flex;align-items:center;gap:8px}
.filters .on{background:var(--text);color:#fff;border-color:var(--text)}
.filters .needs::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warning)}
.grid{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{border:1px solid var(--border-panel);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:4px;position:relative;background:#fff}
.card.sel{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.logo-tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;flex:0 0 auto}
.logo-tile.big{width:56px;height:56px;border-radius:15px;font-size:23px}
.logo-tile.sm{width:36px;height:36px;border-radius:10px;font-size:15px}
.status{padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.status.warn{background:var(--warning-bg);color:var(--warning)}
.status.bad{background:var(--danger-bg);color:var(--danger)}
.status.ok{background:var(--success-bg);color:var(--success)}
.status.quiet{background:var(--selection);color:var(--muted)}
.card b.name{font-size:15px;font-weight:600}
.card .line{color:var(--muted);font-size:13.5px}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted);font-size:12.5px;min-height:26px}
.faces{display:flex}.faces img{width:24px;height:24px;border-radius:50%;margin-right:-5px;box-shadow:0 0 0 2px #fff;background:#fff}
.panel{width:440px;flex:0 0 auto;border-left:1px solid var(--border);padding:26px 28px;display:flex;flex-direction:column;gap:16px;position:relative}
.panel h2{margin:0;font-size:21px;font-weight:650}
.panel h3{margin:0 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between}
.panel h3 span{text-transform:none;letter-spacing:0;font-weight:500}
.callout{padding:12px 14px;border-radius:12px;background:var(--warning-bg);color:#5d3b0a;font-size:13.5px;line-height:1.45;display:flex;flex-direction:column;gap:8px}
.callout .row{display:flex;gap:8px}
.actions{list-style:none;margin:0;padding:0}
.actions li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border)}
.actions li b{font-weight:550;font-size:13.5px;display:block}
.actions small{color:var(--muted);font-size:12px}
.seg{display:inline-flex;border:1px solid var(--border-panel);border-radius:9px;padding:2px;gap:2px;background:#fff;flex:0 0 auto}
.seg span{padding:4px 9px;border-radius:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.seg .allow{background:var(--success-bg);color:var(--success);font-weight:600}
.seg .ask{background:var(--warning-bg);color:var(--warning);font-weight:600}
.seg .block{background:var(--selection);color:var(--text);font-weight:600}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.kv .via{color:var(--muted);font-size:12.5px}
.danger-link{color:var(--danger);font-weight:550;font-size:13.5px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--selection);font-weight:550}
.chip.read{background:var(--success-bg);color:var(--success)}
.chip.money{background:#fbefdc;color:#8a5a12}
.chip.out{background:var(--info-bg);color:var(--link)}
.chip.del{background:var(--danger-bg);color:var(--danger)}
/* dialogs */
.scrim{position:absolute;left:88px;top:12px;width:1340px;height:876px;border-radius:18px;background:rgb(34 37 42/.42);z-index:5}
.dialog{position:absolute;background:#fff;border-radius:18px;z-index:6;box-shadow:0 12px 40px rgb(0 0 0/.2);display:flex;flex-direction:column}
.d-head{display:flex;align-items:center;gap:12px;padding:20px 24px 14px;border-bottom:1px solid var(--border)}
.d-head h3{margin:0;font-size:20px;font-weight:650;flex:1}
.x{width:34px;height:34px;border-radius:9px;border:1px solid var(--border-control);display:grid;place-items:center}
.d-body{flex:1;min-height:0;padding:18px 24px;display:flex;flex-direction:column;gap:14px;position:relative}
.d-foot{display:flex;align-items:center;gap:10px;padding:14px 24px 18px;border-top:1px solid var(--border)}
.d-foot .right{margin-left:auto;display:flex;gap:10px}
.notice{display:flex;gap:10px;border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;background:var(--info-bg);color:#2e3f8f}
.notice.warn{background:var(--warning-bg);color:#6b4209}
.notice.ok{background:var(--success-bg);color:#1d5a47}
.notice .i{width:17px;height:17px;margin-top:1px}
/* catalog */
.cat{display:flex;flex:1;min-height:0}
.cat-nav{width:250px;border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:2px;font-size:14px;flex:0 0 auto;position:relative}
.cat-nav .h{font-size:11.5px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.cat-nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:9px;color:var(--text)}
.cat-nav a.on{background:var(--selection);font-weight:600}
.cat-nav a small{color:var(--muted);font-size:12.5px}
.cat-nav a .next{font-size:11px;background:var(--info-bg);color:var(--link);padding:1px 7px;border-radius:6px;font-weight:600}
.cat-main{flex:1;min-width:0;padding:16px 22px;display:flex;flex-direction:column;gap:14px;position:relative}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--border-panel);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.tile-top{display:flex;gap:12px;align-items:center}
.tile-top b{font-size:14.5px;font-weight:600;display:block}
.tile-top small{color:var(--muted);font-size:12.5px}
.tfoot{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.tfoot small{color:var(--muted);font-size:12.5px}
/* agent pages */
.roster{width:286px;border-right:1px solid var(--border);padding:28px 16px;flex:0 0 auto}
.roster h1{font-size:22px;margin:0;font-weight:650}
.roster-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.roster .s{display:flex;align-items:center;gap:8px;height:40px;border-radius:10px;border:1px solid var(--border-control);padding:0 12px;color:var(--muted);margin-bottom:14px}
.agent-row{display:flex;gap:12px;padding:10px;border-radius:12px;align-items:center;margin-bottom:2px}
.agent-row.on{background:var(--selection)}
.agent-row img{width:40px;height:40px;border-radius:50%}
.agent-row b{display:block;font-weight:550;font-size:14.5px}
.agent-row small{display:block;color:var(--muted);font-size:13px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.create-head{display:flex;justify-content:space-between;align-items:center;padding:30px 32px 10px}
.create-head h2{margin:0;font-size:26px;font-weight:650}
.steps{display:flex;gap:26px;align-items:center;padding:8px 32px 18px;border-bottom:1px solid var(--border);color:var(--muted)}
.steps span{display:flex;align-items:center;gap:10px}
.steps i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--selection);font-size:12px;font-weight:600}
.steps .cur{color:var(--text);font-weight:600}.steps .cur i{background:var(--accent);color:#fff}
.steps .done i{background:var(--success);color:#fff}
.body{flex:1;min-height:0;padding:20px 32px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;align-items:start}
.foot{display:flex;align-items:center;gap:12px;padding:16px 32px 20px;border-top:1px solid var(--border)}
.group{font-size:12px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 0}
.app-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--border);position:relative}
.app-row b{font-weight:600;font-size:14.5px}
.app-row small{display:block;color:var(--muted);font-size:13px;margin:2px 0 5px}
.switch{width:40px;height:22px;border-radius:999px;background:var(--border-control);position:relative;margin-top:4px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff}
.switch.on{background:var(--accent)}.switch.on::after{left:21px}
.side-card{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--soft);font-size:13.5px;line-height:1.55}
.side-card h4{margin:0 0 8px;font-size:14.5px}
.ask-row{display:flex;align-items:center;gap:12px;border:1px dashed var(--border-panel);border-radius:12px;padding:12px 14px;margin-top:14px;position:relative}
/* states */
.grid4{position:absolute;left:88px;top:12px;width:1340px;height:876px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px}
.state{background:#fff;border-radius:18px;box-shadow:0 8px 24px rgb(23 33 43/10%);padding:20px 24px;position:relative;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.state-title{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:650}
.mini{border:1px solid var(--border-panel);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.mini b{font-size:13.5px;font-weight:600;display:block}.mini small{color:var(--muted);font-size:12px}
.field label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
.input{border:1px solid var(--border-control);border-radius:10px;padding:9px 12px;font-size:13.5px;color:var(--muted)}
.radio-row{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--border-panel);border-radius:12px;padding:12px 14px}
.radio-row.on{border:2px solid var(--accent);padding:11px 13px}
.radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-control);flex:0 0 auto;margin-top:1px}
.radio.on{border:5px solid var(--accent)}
.radio-row b{display:block;font-size:14px;font-weight:600}.radio-row small{color:var(--muted);font-size:12.5px}
.sent{border:1px solid var(--border);border-radius:12px;background:var(--soft);padding:12px 14px;font-size:13.5px;display:grid;grid-template-columns:80px 1fr;gap:5px 10px}
.sent dt{color:var(--muted)}.sent dd{margin:0}
.timeline{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:6px}
.timeline li{display:flex;gap:8px;align-items:center}
.timeline .dot{width:8px;height:8px;border-radius:50%;background:var(--border-control)}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="chat" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
<symbol id="activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
<symbol id="bot" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M9 13v1M15 13v1M2 14h2M20 14h2"/></symbol>
<symbol id="library" viewBox="0 0 24 24"><path d="m16 6 4 14M12 6v14M8 8v12M4 4v16"/></symbol>
<symbol id="apps" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></symbol>
<symbol id="sliders" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="alert" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></symbol>
<symbol id="pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
<symbol id="refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></symbol>
<symbol id="info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></symbol>
<symbol id="server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></symbol>
<symbol id="hammer" viewBox="0 0 24 24"><path d="m15 12-8.5 8.5a2.1 2.1 0 0 1-3-3L12 9"/><path d="M17.6 15 22 10.6 13.4 2 9 6.4z"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
<symbol id="out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
</svg>
<div id="root"></div>
<script>
const AV = n => `../../web/public/agent-avatars/robot-${n}.svg`;
const I = (id) => `<svg class="i"><use href="#${id}"/></svg>`;
const pin = (n, style) => `<span class="pin" style="${style}">${n}</span>`;
const hues = { Gmail: '#c5402f', 'Google Calendar': '#2f6fd1', 'Google Drive': '#1f8a5b', 'Google Sheets': '#21894f', Outlook: '#1d5fb8', 'Delivery tracker': '#7a4fd0', 'Zoho Books': '#c9581f', HubSpot: '#d8572a', QuickBooks: '#2b8a3e', Slack: '#5b2c6f', Notion: '#33363b', Jira: '#2361c6', Razorpay: '#1f4fbf', Shopify: '#4f8a2b', Freshdesk: '#2a8a7a', 'Zoho CRM': '#b33f3f' };
const logo = (name, size = '') => `<span class="logo-tile ${size}" style="background:${hues[name] || '#55606c'}">${name === 'Delivery tracker' ? I('server') : name[0]}</span>`;
function rail(on = 'Apps') {
  const items = [['home','Home'],['chat','Chat'],['activity','Activity'],['bot','Agents'],['library','Library'],['apps','Apps']];
  return `<nav class="rail"><img class="logo" src="../../web/public/brand/cuckoo-symbol.svg" alt="">
    ${items.map(([icon, label]) => `<a class="${label === on ? 'on' : ''}" title="${label}">${I(icon)}</a>`).join('')}
    <div class="bottom"><a>${I('sliders')}</a><span class="me">RK</span></div></nav>`;
}
function notes(title, items, sub = '') {
  return `<aside class="notes"><h2>${title}</h2><ol>${items.map((text, index) => `<li><i>${index + 1}</i><span>${text}</span></li>`).join('')}</ol>${sub ? `<div class="sub">${sub}</div>` : ''}</aside>`;
}
const screen = (id, app, side, on) => `<section class="screen" id="${id}"><div class="app">${rail(on)}${app}</div>${side}</section>`;
const seg = mode => `<span class="seg"><span class="${mode === 'allow' ? 'allow' : ''}">Allow</span><span class="${mode === 'ask' ? 'ask' : ''}">Ask first</span><span class="${mode === 'block' ? 'block' : ''}">Block</span></span>`;
const kind = k => ({ read: '<span class="chip read">Reads</span>', change: '<span class="chip">Changes</span>', money: '<span class="chip money">Money</span>', out: '<span class="chip out">Sends outside</span>', del: '<span class="chip del">Deletes</span>' }[k]);
const faces = list => `<span class="faces">${list.map(n => `<img src="${AV(n)}" alt="">`).join('')}</span>`;
function card(name, line, status, foot, agentsList, sel) {
  return `<div class="card ${sel ? 'sel' : ''}"><div class="card-top">${logo(name)}${status}</div><b class="name">${name}</b><span class="line">${line}</span>
    <div class="card-foot">${agentsList.length ? faces(agentsList) : '<span>No agents yet</span>'}<span>${foot}</span></div></div>`;
}
const appsHeader = `<header class="apps-header"><h1>Apps</h1><div class="tools"><span class="search">${I('search')}Search apps</span><span class="btn">Build an app</span><span class="btn primary">${I('plus')}Add app</span></div></header>
