AWSTemplateFormatVersion: '2010-09-09'
Description: Retained private data; PostgreSQL admin password is managed by RDS.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
  PostgresVersion:
    Type: String
    AllowedPattern: '18\.[0-9]+'
    Description: Explicit orderable PostgreSQL 18 version; verify SQL/TLS/restore in M2.
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed manifest.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: This trial is validated only for Mumbai.
Resources:
  Files:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: {Fn::Sub: '${Environment}-${AWS::AccountId}-${AWS::Region}-files'}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
  FilesPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: Files}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - {Fn::GetAtt: [Files, Arn]}
              - {Fn::Sub: '${Files.Arn}/*'}
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated database subnets
      SubnetIds:
        Fn::Split: [',', {Fn::ImportValue: {Fn::Sub: '${Environment}-DatabaseSubnets'}}]
  Parameters:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: Require encrypted PostgreSQL connections
      Family: postgres18
      Parameters: {rds.force_ssl: '1'}
  DatabaseLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {Fn::Sub: '/aws/rds/instance/${Environment}-core/postgresql'}
      RetentionInDays: 7
  Database:
    Type: AWS::RDS::DBInstance
    DependsOn: DatabaseLogs
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: {Fn::Sub: '${Environment}-core'}
      DBName: ayati
      Engine: postgres
      EngineVersion: {Ref: PostgresVersion}
      DBInstanceClass: db.t4g.small
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MasterUsername: ayati_admin
      ManageMasterUserPassword: true
      DBSubnetGroupName: {Ref: SubnetGroup}
      DBParameterGroupName: {Ref: Parameters}
      VPCSecurityGroups:
        - {Fn::ImportValue: {Fn::Sub: '${Environment}-DatabaseGroup'}}
      PubliclyAccessible: false
      MultiAZ: false
      Port: '5432'
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: false
      AllowMajorVersionUpgrade: false
      EnableCloudwatchLogsExports: [postgresql]
Outputs:
  BucketName:
    Value: {Ref: Files}
    Export: {Name: {Fn::Sub: '${Environment}-BucketName'}}
  DatabaseEndpoint:
    Value: {Fn::GetAtt: [Database, Endpoint.Address]}
  AdminSecretArn:
    Description: Migration/recovery only; never the controller runtime credential.
    Value: {Fn::GetAtt: [Database, MasterUserSecret.SecretArn]}
