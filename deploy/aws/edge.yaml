AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS-only trial edge using an existing issued ACM certificate.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
  Hostname:
    Type: String
    AllowedPattern: '([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}'
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:ap-south-1:[0-9]{12}:certificate/[a-f0-9-]+'
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed manifest.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: This trial is validated only for Mumbai.
Resources:
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      Subnets:
        Fn::Split: [',', {Fn::ImportValue: {Fn::Sub: '${Environment}-PublicSubnets'}}]
      SecurityGroups:
        - {Fn::ImportValue: {Fn::Sub: '${Environment}-EdgeGroup'}}
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  Https:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: {Ref: LoadBalancer}
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: {Ref: CertificateArn}}]
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: '404', ContentType: text/plain, MessageBody: Unknown host}
  HostRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: {Ref: Https}
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig: {Values: [{Ref: Hostname}]}
      Actions:
        - Type: forward
          TargetGroupArn: {Fn::ImportValue: {Fn::Sub: '${Environment}-ControllerTargetGroup'}}
Outputs:
  PublicOrigin:
    Value: {Fn::Sub: 'https://${Hostname}'}
  DnsTarget:
    Value: {Fn::GetAtt: [LoadBalancer, DNSName]}
  CanonicalHostedZoneId:
    Value: {Fn::GetAtt: [LoadBalancer, CanonicalHostedZoneID]}
