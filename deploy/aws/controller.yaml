AWSTemplateFormatVersion: '2010-09-09'
Description: Dormant EC2 controller definition; M2 startup/secret/TLS integration is required.
Metadata:
  AyatiGate: M0 only. No controller instances may launch from this revision.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Explicit inspected x86_64 Linux AMI; never resolve latest at deployment.
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed manifest.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: This trial is validated only for Mumbai.
Resources:
  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: {Ref: AmiId}
        InstanceType: t3.medium
        IamInstanceProfile:
          Name: {Fn::ImportValue: {Fn::Sub: '${Environment}-ControllerProfile'}}
        MetadataOptions:
          HttpTokens: required
          HttpEndpoint: enabled
          HttpPutResponseHopLimit: 2
          InstanceMetadataTags: disabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeType: gp3
              VolumeSize: 20
              Encrypted: true
              DeleteOnTermination: true
        NetworkInterfaces:
          - DeviceIndex: 0
            AssociatePublicIpAddress: false
            Groups:
              - {Fn::ImportValue: {Fn::Sub: '${Environment}-ControllerGroup'}}
        CreditSpecification: {CpuCredits: standard}
        UserData:
          Fn::Base64: |
            #!/bin/sh
            # M0 has no cloud startup adapter. Zero ASG maximum is intentional.
            echo 'M2 controller bootstrap, verified DB TLS and secret delivery are required.' >&2
            exit 1
  Controllers:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: '0'
      MaxSize: '0'
      DesiredCapacity: '0'
      TargetGroupARNs: [{Ref: Targets}]
      LaunchTemplate:
        LaunchTemplateId: {Ref: LaunchTemplate}
        Version: {Fn::GetAtt: [LaunchTemplate, LatestVersionNumber]}
      VPCZoneIdentifier:
        Fn::Split: [',', {Fn::ImportValue: {Fn::Sub: '${Environment}-AppSubnets'}}]
      HealthCheckType: EC2
      HealthCheckGracePeriod: 120
      Tags:
        - {Key: Name, Value: {Ref: Environment}, PropagateAtLaunch: true}
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: {Fn::ImportValue: {Fn::Sub: '${Environment}-VpcId'}}
      Protocol: HTTP
      Port: 8765
      TargetType: instance
      HealthCheckPath: /health/ready
      Matcher: {HttpCode: '200'}
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '90'}
Outputs:
  ControllerTargetGroup:
    Value: {Ref: Targets}
    Export: {Name: {Fn::Sub: '${Environment}-ControllerTargetGroup'}}
  ActivationStatus:
    Value: BLOCKED_M2_STARTUP_AND_M3_MACHINE_IDENTITY
