AWSTemplateFormatVersion: '2010-09-09'
Description: Dormant prepared executor service; cross-host M3 adapter is not implemented.
Metadata:
  AyatiGate: No live tasks, scaling or context before M2/M3 identity, scratch and drain proof.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
  ImageUri:
    Type: String
    AllowedPattern: '[0-9]{12}\.dkr\.ecr\.ap-south-1\.amazonaws\.com/ayati-[a-z0-9-]+/runtime@sha256:[a-f0-9]{64}'
    Description: Pushed and verified registry manifest digest; not a local Docker image ID.
  Model:
    Type: String
    MinLength: 1
    MaxLength: 200
  ModelProvider:
    Type: String
    AllowedValues: [openai, fireworks-ai]
  ModelSecretArn:
    Type: String
    AllowedPattern: 'arn:aws:secretsmanager:ap-south-1:[0-9]{12}:secret:.+'
Conditions:
  Openai: {Fn::Equals: [{Ref: ModelProvider}, openai]}
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed manifest.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: This trial is validated only for Mumbai.
Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: {Fn::Sub: '${Environment}-executors'}
      ClusterSettings: [{Name: containerInsights, Value: disabled}]
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: {Fn::Sub: '${Environment}-executor'}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '2048'
      Memory: '4096'
      RuntimePlatform: {CpuArchitecture: X86_64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: {Fn::ImportValue: {Fn::Sub: '${Environment}-ExecutionRole'}}
      TaskRoleArn: {Fn::ImportValue: {Fn::Sub: '${Environment}-ExecutorRole'}}
      Volumes: [{Name: scratch}, {Name: temporary}]
      ContainerDefinitions:
        # Fargate bind volumes start root-owned. This trusted init receives no secrets.
        # Only CHOWN from the default capability set is retained for volume setup.
        - Name: scratch-init
          Image: {Ref: ImageUri}
          Essential: false
          User: '0:0'
          ReadonlyRootFilesystem: true
          EntryPoint: [/bin/sh, -ec]
          Command: ['chmod 700 /var/lib/ayati /tmp; chown 10001:10001 /var/lib/ayati /tmp']
          LinuxParameters:
            Capabilities:
              Drop: [DAC_OVERRIDE, FSETID, FOWNER, MKNOD, NET_RAW, SETGID, SETUID, SETFCAP, SETPCAP, NET_BIND_SERVICE, SYS_CHROOT, KILL, AUDIT_WRITE]
          MountPoints:
            - {SourceVolume: scratch, ContainerPath: /var/lib/ayati, ReadOnly: false}
            - {SourceVolume: temporary, ContainerPath: /tmp, ReadOnly: false}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: {Fn::ImportValue: {Fn::Sub: '${Environment}-ExecutorLogs'}}
              awslogs-region: {Ref: 'AWS::Region'}
              awslogs-stream-prefix: init
        - Name: executor
          Image: {Ref: ImageUri}
          Essential: true
          User: '10001:10001'
          ReadonlyRootFilesystem: true
          Command: [executor]
          DependsOn: [{ContainerName: scratch-init, Condition: SUCCESS}]
          StopTimeout: 120
          LinuxParameters: {InitProcessEnabled: true, Capabilities: {Drop: [ALL]}}
          Environment:
            - {Name: AYATI_EXECUTOR_SLOTS, Value: '2'}
            - {Name: AYATI_GOOSE_PROVIDER, Value: {Ref: ModelProvider}}
            - {Name: AYATI_MODEL, Value: {Ref: Model}}
            # Current code permits only loopback. No network/bootstrap shortcut.
            - {Name: AYATI_WORKER_CONTROL_URL, Value: 'http://127.0.0.1:8766'}
            - {Name: AYATI_WORKER_CONTROL_KEY_FILE, Value: /var/lib/ayati/control.key}
          Secrets:
            - Name: {Fn::If: [Openai, OPENAI_API_KEY, FIREWORKS_API_KEY]}
              ValueFrom: {Ref: ModelSecretArn}
          MountPoints:
            - {SourceVolume: scratch, ContainerPath: /var/lib/ayati, ReadOnly: false}
            - {SourceVolume: temporary, ContainerPath: /tmp, ReadOnly: false}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: {Fn::ImportValue: {Fn::Sub: '${Environment}-ExecutorLogs'}}
              awslogs-region: {Ref: 'AWS::Region'}
              awslogs-stream-prefix: executor
  Service:
    Type: AWS::ECS::Service
    Properties:
      Cluster: {Ref: Cluster}
      ServiceName: {Fn::Sub: '${Environment}-executor'}
      TaskDefinition: {Ref: Task}
      LaunchType: FARGATE
      PlatformVersion: 1.4.0
      DesiredCount: 0
      EnableExecuteCommand: false
      DeploymentConfiguration:
        DeploymentCircuitBreaker: {Enable: true, Rollback: true}
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            Fn::Split: [',', {Fn::ImportValue: {Fn::Sub: '${Environment}-AppSubnets'}}]
          SecurityGroups:
            - {Fn::ImportValue: {Fn::Sub: '${Environment}-ExecutorGroup'}}
  Scaling:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MinCapacity: 0
      MaxCapacity: 0
      ResourceId: {Fn::Sub: 'service/${Cluster}/${Service.Name}'}
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      SuspendedState:
        DynamicScalingInSuspended: true
        DynamicScalingOutSuspended: true
        ScheduledScalingSuspended: true
Outputs:
  ActivationStatus:
    Value: BLOCKED_M3_TRANSPORT_IDENTITY_AND_M2_SCRATCH_DRAIN
