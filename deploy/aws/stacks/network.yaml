AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Temporary Ayati test network: two zones, one single-zone NAT, private service
  discovery for worker control. Deleted with the environment.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
  ZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
  ZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed manifest.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: Ayati runs in Mumbai (ap-south-1).
  SeparateZones:
    Assertions:
      - Assert:
          Fn::Not:
            - Fn::Equals: [{Ref: ZoneA}, {Ref: ZoneB}]
        AssertDescription: Two different availability zones are required.
Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.48.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{Key: Name, Value: {Ref: Environment}}]
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: {Ref: Vpc}
      InternetGatewayId: {Ref: InternetGateway}
  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {Ref: ZoneA}
      CidrBlock: 10.48.0.0/24
      MapPublicIpOnLaunch: false
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {Ref: ZoneB}
      CidrBlock: 10.48.1.0/24
      MapPublicIpOnLaunch: false
  AppA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {Ref: ZoneA}
      CidrBlock: 10.48.16.0/24
      MapPublicIpOnLaunch: false
  AppB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {Ref: ZoneB}
      CidrBlock: 10.48.17.0/24
      MapPublicIpOnLaunch: false
  DatabaseA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {Ref: ZoneA}
      CidrBlock: 10.48.32.0/24
      MapPublicIpOnLaunch: false
  DatabaseB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: {Ref: Vpc}
      AvailabilityZone: {Ref: ZoneB}
      CidrBlock: 10.48.33.0/24
      MapPublicIpOnLaunch: false
  PublicRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: {Ref: Vpc}}
  PublicInternet:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: {Ref: PublicRoutes}
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: {Ref: InternetGateway}
  PublicRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: PublicA}, RouteTableId: {Ref: PublicRoutes}}
  PublicRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: PublicB}, RouteTableId: {Ref: PublicRoutes}}
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties: {Domain: vpc}
  Nat:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: {Fn::GetAtt: [NatAddress, AllocationId]}
      SubnetId: {Ref: PublicA}
  AppRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: {Ref: Vpc}}
  AppInternet:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: {Ref: AppRoutes}
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: {Ref: Nat}
  AppRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: AppA}, RouteTableId: {Ref: AppRoutes}}
  AppRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: AppB}, RouteTableId: {Ref: AppRoutes}}
  DatabaseRoutes:
    Type: AWS::EC2::RouteTable
    Properties: {VpcId: {Ref: Vpc}}
  DatabaseRouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: DatabaseA}, RouteTableId: {Ref: DatabaseRoutes}}
  DatabaseRouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: {Ref: DatabaseB}, RouteTableId: {Ref: DatabaseRoutes}}
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: {Ref: Vpc}
      ServiceName: {Fn::Sub: 'com.amazonaws.${AWS::Region}.s3'}
      VpcEndpointType: Gateway
      RouteTableIds: [{Ref: AppRoutes}]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: [s3:GetObject, s3:PutObject, s3:ListBucket]
            Resource:
              - {Fn::Sub: 'arn:${AWS::Partition}:s3:::${Environment}-${AWS::AccountId}-${AWS::Region}-files'}
              - {Fn::Sub: 'arn:${AWS::Partition}:s3:::${Environment}-${AWS::AccountId}-${AWS::Region}-files/*'}
          # ECR stores image layers in this AWS-owned regional S3 bucket.
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: {Fn::Sub: 'arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*'}
  # Executors find any controller at worker-control.ayati.internal (D225).
  Discovery:
    Type: AWS::ServiceDiscovery::PrivateDnsNamespace
    Properties:
      Name: ayati.internal
      Vpc: {Ref: Vpc}
  EdgeGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS entry only
      VpcId: {Ref: Vpc}
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 8765, ToPort: 8765, CidrIp: 10.48.16.0/23}
  ControllerGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API from the edge, worker control from executors, PostgreSQL out
      VpcId: {Ref: Vpc}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8765
          ToPort: 8765
          SourceSecurityGroupId: {Ref: EdgeGroup}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, CidrIp: 10.48.32.0/23}
  ExecutorGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound HTTPS and worker control only; no listener or database route
      VpcId: {Ref: Vpc}
      SecurityGroupEgress:
        - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}
  # Separate rules: the two groups refer to each other.
  WorkerControlIn:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: {Ref: ControllerGroup}
      IpProtocol: tcp
      FromPort: 8766
      ToPort: 8766
      SourceSecurityGroupId: {Ref: ExecutorGroup}
  WorkerControlOut:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: {Ref: ExecutorGroup}
      IpProtocol: tcp
      FromPort: 8766
      ToPort: 8766
      DestinationSecurityGroupId: {Ref: ControllerGroup}
  DatabaseGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL from controllers and the database setup task only
      VpcId: {Ref: Vpc}
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: {Ref: ControllerGroup}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 127.0.0.1/32}
Outputs:
  VpcId:
    Value: {Ref: Vpc}
    Export: {Name: {Fn::Sub: '${Environment}-VpcId'}}
  PublicSubnets:
    Value: {Fn::Join: [',', [{Ref: PublicA}, {Ref: PublicB}]]}
    Export: {Name: {Fn::Sub: '${Environment}-PublicSubnets'}}
  AppSubnets:
    Value: {Fn::Join: [',', [{Ref: AppA}, {Ref: AppB}]]}
    Export: {Name: {Fn::Sub: '${Environment}-AppSubnets'}}
  DatabaseSubnets:
    Value: {Fn::Join: [',', [{Ref: DatabaseA}, {Ref: DatabaseB}]]}
    Export: {Name: {Fn::Sub: '${Environment}-DatabaseSubnets'}}
  EdgeGroup:
    Value: {Ref: EdgeGroup}
    Export: {Name: {Fn::Sub: '${Environment}-EdgeGroup'}}
  ControllerGroup:
    Value: {Ref: ControllerGroup}
    Export: {Name: {Fn::Sub: '${Environment}-ControllerGroup'}}
  ExecutorGroup:
    Value: {Ref: ExecutorGroup}
    Export: {Name: {Fn::Sub: '${Environment}-ExecutorGroup'}}
  DatabaseGroup:
    Value: {Ref: DatabaseGroup}
    Export: {Name: {Fn::Sub: '${Environment}-DatabaseGroup'}}
  DiscoveryNamespace:
    Value: {Ref: Discovery}
    Export: {Name: {Fn::Sub: '${Environment}-DiscoveryNamespace'}}
