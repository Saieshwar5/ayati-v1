AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Temporary Ayati database: Aurora PostgreSQL Serverless v2. env.sh park keeps it
  paused at 0 ACU; env.sh down snapshots it and deletes it, and env.sh up restores
  the latest snapshot, so data carries over; the files bucket and passwords live
  in the keep stack.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
  PostgresVersion:
    Type: String
    Default: '18.6'
    AllowedPattern: '18\.[0-9]+'
    Description: Orderable Aurora PostgreSQL 18 version for db.serverless in Mumbai.
  MinCapacity:
    Type: String
    AllowedValues: ['0', '0.5', '1', '2']
    Default: '0.5'
    Description: >-
      Aurora capacity units when idle. '0' (parked) lets Aurora pause after
      AutoPauseSeconds without connections; only storage is billed then.
  AutoPauseSeconds:
    Type: Number
    Default: 300
    MinValue: 300
    MaxValue: 86400
  MaxCapacity:
    Type: Number
    Default: 2
    Description: Caps cost while migrating or under load; 2 suits one test workspace.
  SnapshotIdentifier:
    Type: String
    Default: ''
    Description: >-
      Cluster snapshot to restore, or empty for a new database. Must stay the same
      for the life of the stack: changing it replaces the database.
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed account.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: Ayati runs in Mumbai (ap-south-1).
Conditions:
  Restore: {Fn::Not: [{Fn::Equals: [{Ref: SnapshotIdentifier}, '']}]}
  CanPause: {Fn::Equals: [{Ref: MinCapacity}, '0']}
Resources:
  SubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Isolated database subnets
      SubnetIds:
        Fn::Split: [',', {Fn::ImportValue: {Fn::Sub: '${Environment}-DatabaseSubnets'}}]
  ClusterParameters:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: Require encrypted PostgreSQL connections
      Family: aurora-postgresql18
      Parameters: {rds.force_ssl: '1'}
  Cluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: {Fn::Sub: '${Environment}-core'}
      Engine: aurora-postgresql
      EngineVersion: {Ref: PostgresVersion}
      # A restore inherits the name, owner, password and encryption from the snapshot.
      SnapshotIdentifier: {Fn::If: [Restore, {Ref: SnapshotIdentifier}, {Ref: 'AWS::NoValue'}]}
      DatabaseName: {Fn::If: [Restore, {Ref: 'AWS::NoValue'}, ayati]}
      MasterUsername: {Fn::If: [Restore, {Ref: 'AWS::NoValue'}, ayati_admin]}
      MasterUserPassword:
        Fn::If:
          - Restore
          - {Ref: 'AWS::NoValue'}
          - Fn::Sub:
              - '{{resolve:secretsmanager:${Arn}:SecretString:password}}'
              - {Arn: {Fn::ImportValue: {Fn::Sub: '${Environment}-AdminSecretArn'}}}
      DBSubnetGroupName: {Ref: SubnetGroup}
      DBClusterParameterGroupName: {Ref: ClusterParameters}
      VpcSecurityGroupIds:
        - {Fn::ImportValue: {Fn::Sub: '${Environment}-DatabaseGroup'}}
      StorageEncrypted: {Fn::If: [Restore, {Ref: 'AWS::NoValue'}, true]}
      BackupRetentionPeriod: 1
      DeletionProtection: false
      EnableCloudwatchLogsExports: [postgresql]
      ServerlessV2ScalingConfiguration:
        MinCapacity: {Ref: MinCapacity}
        MaxCapacity: {Ref: MaxCapacity}
        SecondsUntilAutoPause: {Fn::If: [CanPause, {Ref: AutoPauseSeconds}, {Ref: 'AWS::NoValue'}]}
  # One writer; a reader in a second zone arrives with the Step 8 failover drills.
  Writer:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: {Ref: Cluster}
      DBInstanceClass: db.serverless
      Engine: aurora-postgresql
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: false
Outputs:
  DatabaseHost:
    Value: {Fn::GetAtt: [Cluster, Endpoint.Address]}
    Export: {Name: {Fn::Sub: '${Environment}-DatabaseHost'}}
