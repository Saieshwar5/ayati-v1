AWSTemplateFormatVersion: '2010-09-09'
Description: Immutable image registry and retained bounded operational logs.
Parameters:
  ExpectedAccountId:
    Type: String
    AllowedPattern: '[0-9]{12}'
  Environment:
    Type: String
    AllowedPattern: 'ayati-[a-z0-9-]{1,18}'
Rules:
  DeploymentTarget:
    Assertions:
      - Assert: {Fn::Equals: [{Ref: 'AWS::AccountId'}, {Ref: ExpectedAccountId}]}
        AssertDescription: The current AWS account must match the reviewed manifest.
      - Assert: {Fn::Equals: [{Ref: 'AWS::Region'}, ap-south-1]}
        AssertDescription: This trial is validated only for Mumbai.
Resources:
  Registry:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: {Fn::Sub: '${Environment}/runtime'}
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      EmptyOnDelete: false
  ControllerLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {Fn::Sub: '/ayati/${Environment}/controller'}
      RetentionInDays: 7
  ExecutorLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: {Fn::Sub: '/ayati/${Environment}/executor'}
      RetentionInDays: 7
Outputs:
  RepositoryUri:
    Value: {Fn::GetAtt: [Registry, RepositoryUri]}
  RepositoryArn:
    Value: {Fn::GetAtt: [Registry, Arn]}
    Export: {Name: {Fn::Sub: '${Environment}-RepositoryArn'}}
  ControllerLogs:
    Value: {Ref: ControllerLogs}
    Export: {Name: {Fn::Sub: '${Environment}-ControllerLogs'}}
  ExecutorLogs:
    Value: {Ref: ExecutorLogs}
    Export: {Name: {Fn::Sub: '${Environment}-ExecutorLogs'}}
