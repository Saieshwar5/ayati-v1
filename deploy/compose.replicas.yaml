# Rehearsal overlay: several API replicas behind a proxy, as on AWS.
#   docker compose -f deploy/compose.yaml -f deploy/compose.replicas.yaml \
#     up -d --scale api=2 --scale executor=2
# Executors reach any replica through the shared `worker-control` name. The
# proxy lists replicas explicitly (AYATI_UPSTREAMS, Compose's container names) so
# its active health checks see a draining replica; Caddy does not health-check
# DNS-discovered upstreams.
services:
  api:
    ports: !reset []
  proxy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    read_only: true
    cap_drop: [ALL]
    # The Caddy binary carries this file capability; without it exec fails.
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    tmpfs: [/data, /config]
    environment:
      AYATI_UPSTREAMS: ${AYATI_UPSTREAMS:?List the API replicas, for example ayati-api-1:8765 ayati-api-2:8765}
    volumes: [./replicas.Caddyfile:/etc/caddy/Caddyfile:ro]
    ports: ["127.0.0.1:${AYATI_LOCAL_PORT:-8765}:8080"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
