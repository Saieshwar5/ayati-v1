name: ayati
x-runtime: &runtime
  image: ${AYATI_IMAGE:-ayati:hosted-local}
  platform: linux/amd64
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=256m,mode=1777
    - /var/lib/ayati:rw,nosuid,nodev,size=1g,uid=10001,gid=10001,mode=0700
  stop_grace_period: 90s
  restart: unless-stopped

# Worker control is loopback-only: executors share the API container's network
# namespace and authenticate with the bootstrap key copied by control-key.
x-worker-control: &worker-control
  AYATI_WORKER_CONTROL_URL: http://127.0.0.1:8766
  AYATI_WORKER_CONTROL_KEY_FILE: /run/ayati-control/key

services:
  control-key:
    <<: *runtime
    # Runs once as root only to hand the operator's key to the runtime UID.
    user: "0:0"
    cap_add: [CHOWN, FOWNER]
    entrypoint: [/usr/bin/install, -o, "10001", -g, "10001", -m, "600",
      /run/secrets/worker_control_key, /run/ayati-control/key]
    volumes: [worker-control:/run/ayati-control]
    secrets: [worker_control_key]
    restart: "no"
  api:
    <<: *runtime
    command: [identity]
    environment:
      <<: *worker-control
      AYATI_PUBLIC_ORIGIN: ${AYATI_PUBLIC_ORIGIN:?Set the HTTPS public origin}
      AYATI_BIND_ADDRESS: 0.0.0.0
      # Report not ready for 15s before closing; stop within 60s (grace is 90s).
      AYATI_DRAIN_SECONDS: ${AYATI_DRAIN_SECONDS:-15}
      AYATI_SHUTDOWN_SECONDS: ${AYATI_SHUTDOWN_SECONDS:-60}
      AYATI_WORKER_PROVIDERS: ${AYATI_WORKER_PROVIDERS:-openai}
      AYATI_MODEL: ${AYATI_MODEL:?Set the default model}
      RELAY_DATABASE_URL_FILE: /run/secrets/database_url
      WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:?Set the WorkOS client ID}
      WORKOS_API_KEY_FILE: /run/secrets/workos_api_key
      CUCKOO_LIBRARY_S3_BUCKET: ${CUCKOO_LIBRARY_S3_BUCKET:-}
      CUCKOO_LIBRARY_S3_ENDPOINT: ${CUCKOO_LIBRARY_S3_ENDPOINT:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    volumes: [worker-control:/run/ayati-control:ro]
    secrets: [database_url, workos_api_key]
    depends_on:
      control-key: {condition: service_completed_successfully}
    # Put a TLS reverse proxy/load balancer in front; this port is private to the host.
    ports: ["127.0.0.1:${AYATI_LOCAL_PORT:-8765}:8765"]
    healthcheck:
      test: [CMD, /opt/ayati/ayati, api-health]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
  executor:
    <<: *runtime
    command: [executor]
    network_mode: service:api
    environment:
      <<: *worker-control
      OPENAI_API_KEY_FILE: /run/secrets/model_api_key
      AYATI_GOOSE_PROVIDER: openai
      AYATI_MODEL: ${AYATI_MODEL:?Set the default model}
      AYATI_EXECUTOR_SLOTS: ${AYATI_EXECUTOR_SLOTS:-2}
    volumes: [worker-control:/run/ayati-control:ro]
    secrets: [model_api_key]
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, /opt/ayati/ayati, executor-health]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 60s
  migrate:
    <<: *runtime
    profiles: [maintenance]
    command: [workspace-db, migrate]
    environment:
      RELAY_DATABASE_URL_FILE: /run/secrets/migration_database_url
    secrets: [migration_database_url]
    restart: "no"

volumes:
  worker-control: {}

secrets:
  database_url:
    file: ${AYATI_DATABASE_URL_FILE:?Set the runtime database URL file}
  migration_database_url:
    file: ${AYATI_MIGRATION_DATABASE_URL_FILE:?Set the migration database URL file}
  workos_api_key:
    file: ${AYATI_WORKOS_API_KEY_FILE:?Set the WorkOS API key file}
  model_api_key:
    file: ${AYATI_MODEL_API_KEY_FILE:?Set the model API key file}
  worker_control_key:
    file: ${AYATI_WORKER_CONTROL_KEY_FILE:?Set the worker-control bootstrap key file}
