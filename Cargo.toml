[workspace]
members = ["crates/guest"]
default-members = ["."]
resolver = "3"

[package]
name = "ayati"
version = "0.1.0"
edition = "2024"
description = "A local-first business agent service powered by Goose"
publish = false

[dependencies]
ayati-guest = { path = "crates/guest" }
agent-client-protocol = { version = "=2.2.0", default-features = false }
anyhow = "1"
base64 = "0.22"
ring = "=0.17.14"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
futures-util = "0.3"
libc = "0.2"
# Worker control TLS on a private network; already in the dependency tree via
# reqwest and sqlx. The aws-lc-rs provider is selected explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
# Archive files are gzip JSON Lines; flate2 is already in the tree via image.
flate2 = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# Executor AWS task identity (D227 slice 7b): official SDK credentials and SigV4
# signing. The two read-only ECS calls are signed requests, not the very large
# ECS SDK crate. One modern HTTPS client, no legacy TLS stack.
aws-sigv4 = "1"
aws-credential-types = "1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-smithy-runtime-api = "1"

[dev-dependencies]
tempfile = "3"

# Lighter local builds (2026-10-30): our code keeps file and line numbers for
# backtraces; dependencies carry no debug info. This cuts build memory and the size
# of target/ sharply on an 8 GB laptop. Release builds are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
