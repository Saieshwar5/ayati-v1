[workspace]
members = ["crates/guest"]
default-members = ["."]
resolver = "3"

[package]
name = "ayati"
version = "0.1.0"
edition = "2024"
description = "A local-first business agent service powered by Goose"
publish = false

[dependencies]
ayati-guest = { path = "crates/guest" }
agent-client-protocol = { version = "=2.2.0", default-features = false }
anyhow = "1"
# Connector providers are trait objects with async methods; already in the
# dependency tree via sea-orm-migration.
async-trait = "0.1"
base64 = "0.22"
ring = "=0.17.14"
axum = { version = "0.8", features = ["multipart"] }
dotenvy = "0.15"
futures-util = "0.3"
libc = "0.2"
# Worker control TLS on a private network; already in the dependency tree via
# reqwest and sqlx. The aws-lc-rs provider is selected explicitly.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
# multipart (2026-11-07): voice-note transcription uploads audio as a form, the
# OpenAI-compatible /audio/transcriptions API. Its mime_guess is already in the tree.
# form (2026-11-10): Twilio's Messages API takes form bodies; serde_urlencoded is
# already in the tree via axum.
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "multipart", "form"] }
rusqlite = { version = "0.38", features = ["bundled"] }
sea-orm = { version = "=2.0.4", default-features = false, features = ["macros", "sqlx-postgres", "runtime-tokio-rustls", "with-json"] }
sea-orm-migration = { version = "=2.0.4", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = { version = "0.7", features = ["compat", "io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
# D246 (2026-11-07): an emoji-only message is told apart by grapheme clusters
# (UAX #29). unicode-segmentation (MIT/Apache-2.0) is already in the tree via
# convert_case; tested with 1.13.3.
unicode-segmentation = "1.13"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
# Archive files are gzip JSON Lines; flate2 is already in the tree via image.
flate2 = "1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# Library LB2a (2026-11-05): agents read Word and Excel uploads. calamine (MIT) reads
# Excel cells with their types and dates; Word text is read from the .docx zip with
# the same zip and quick-xml versions calamine uses (quick-xml is already in the tree
# via object_store). Pure Rust, in process, with size limits; nothing is executed.
calamine = { version = "=0.36.1", default-features = false }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.41.0"
# Executor AWS task identity (D227 slice 7b): official SDK credentials and SigV4
# signing. The two read-only ECS calls are signed requests, not the very large
# ECS SDK crate. One modern HTTPS client, no legacy TLS stack.
aws-sigv4 = "1"
aws-credential-types = "1"
aws-config = { version = "1", default-features = false, features = ["rt-tokio", "behavior-version-latest", "default-https-client"] }
aws-smithy-runtime-api = "1"

[dev-dependencies]
tempfile = "3"

# Lighter local builds (2026-10-30): our code keeps file and line numbers for
# backtraces; dependencies carry no debug info. This cuts build memory and the size
# of target/ sharply on an 8 GB laptop. Release builds are unchanged.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
strip = true
