name: OpenClaw baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OPENCLAW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Install pinned package manager
        run: npm install --global pnpm@12.5.1 --allow-scripts=pnpm
      - name: Verify provenance and update controls
        run: pnpm check
      - name: Test private state and update policy
        run: pnpm test
      - name: Install frozen upstream dependencies
        run: pnpm setup:runtime
      - name: Build runtime and Control UI
        run: pnpm build
      - name: Check source scope and build artifacts
        run: pnpm check
      - name: Check real Gateway and web startup
        run: pnpm test:gateway
